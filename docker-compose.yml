services:
  backend:
    build: ./backend
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5029
      - SERVER_REGISTRY_PATH=/app/data/servers.json
      
      # This flag must be set to the root folder of your server
      # if your server is located at ~/Servers/VanillaServer, then
      # set this to ~/Servers
      - MSM_SERVER_ROOT=/path/to/minecraft-servers

      # Leave this as-is, as it's used internally by docker.
      - MSM_SERVER_MOUNT=/servers
    volumes:
      # Leave this as-is
      - server-data:/app/data
      
      # This flag must be set to the same thing as MSM_SERVER_ROOT above.
      - /path/to/minecraft-servers:/servers

      # Note that JAVA is handled by the Minecraft docker instance below, so no java flag is required.
    
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5029"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  minecraft:
    image: itzg/minecraft-server
    environment:
        # EULA must be true to launch the server. Please note that by setting this to TRUE and
        # running the docker image, you accept the Minecraft EULA (https://www.minecraft.net/en-us/eula)
      - EULA=TRUE

        # Set the version to your preference. Note that newer versions drop the "1.--" prefix.
        # If your entry doesn't work (e.g. 1.26.1), try dropping it (e.g. 26.1)
      - VERSION=1.21.4

        # This must be true if you want the server manager to be able to send commands to the server.
        # Make sure to enable RCON in your server.properties!
      - ENABLE_RCON=true

        # Set this to the same value as the RCON PORT field in the server.properties.
        # It is not recommended to set this port to the same port as the server, nor to any
        # port that you are port forwarding.
      - RCON_PORT=25575

        # Set this to the same password in the server.properties file.
      - RCON_PASSWORD=test_password
    volumes:

        # Set this to the actual server path, not just the root.
      - /path/to/minecraft-servers/my-server:/data
    ports:
      # Set this to the port that you are port-forwarding and that others connect through.
      # By default minecraft uses 25565
      - "25565:25565"

volumes:
  server-data:
