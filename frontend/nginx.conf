server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: a refresh on any client route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # api and signalr go to the backend by compose service name
    # websockets need the upgrade headers, and a read timeout above
    # signalr's keepalive (30s) so nginx doesn't close idle hubs at 60s
    location /api/ {
        proxy_pass http://backend:5029;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://backend:5029;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 105s;
        proxy_send_timeout 105s;
    }
}
